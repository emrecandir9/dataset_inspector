<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dataset Inspector</title>
<meta name="description" content="Local-first dataset inspection platform">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ======================================================================
   Dataset Inspector — Apple-inspired Design System (v2)
   Refined with accent colors, centered landing, premium feel
   ====================================================================== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg-primary:#09090B;--bg-secondary:#121214;--bg-surface:#18181B;
  --bg-elevated:#27272A;--bg-hover:#3F3F46;
  --border-primary:#27272A;--border-secondary:#3F3F46;--border-subtle:#18181B;
  --text-primary:#FAFAFA;--text-secondary:#A1A1AA;
  --text-tertiary:#71717A;--text-quaternary:#52525B;
  --accent:#5076E5;--accent-soft:#7696F8;--accent-dim:rgba(80,118,229,.15);--accent-glow:rgba(80,118,229,.12);
  --color-error:#E96A69;--color-error-dim:rgba(233,106,105,.15);
  --color-warning:#F8D866;--color-warning-dim:rgba(248,216,102,.15);
  --color-success:#32D74B;--color-success-dim:rgba(50,215,75,.15);
  --color-info:#76719C;--color-info-dim:rgba(118,113,156,.15);
  --purple:#76719C;--purple-dim:rgba(118,113,156,.15);
  --teal:#5CC9CE;--teal-dim:rgba(92,201,206,.15);
  --orange:#E26147;--orange-dim:rgba(226,97,71,.15);
  --pink:#FA9DB7;--pink-dim:rgba(250,157,183,.15);
  --font-family:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',system-ui,sans-serif;
  --sidebar-width:220px;
}

html{font-size:15px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font-family);background:var(--bg-primary);color:var(--text-primary);line-height:1.5;letter-spacing:-.2px;overflow-x:hidden}
#root{min-height:100vh}

/* ---- Layout ---- */
.app-layout{display:flex;width:100%;min-height:100vh}
.app-content{flex:1;min-width:0;padding:48px 64px;margin-left:var(--sidebar-width)}

/* ---- Sidebar ---- */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-width);height:100vh;background:var(--bg-secondary);border-right:1px solid var(--border-primary);padding:24px 0;display:flex;flex-direction:column;z-index:100}
.sidebar-brand{padding:0 20px;margin-bottom:40px}
.sidebar-brand h1{font-size:13px;font-weight:600;color:var(--text-primary);letter-spacing:-.1px}
.sidebar-brand p{font-size:11px;color:var(--text-quaternary);margin-top:4px}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 8px}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:13px;color:var(--text-secondary);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;transition:all .15s ease}
.sidebar-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.sidebar-item.active{background:var(--accent-dim);color:var(--accent-soft)}
.sidebar-icon{width:18px;text-align:center;font-size:13px;opacity:.6}
.sidebar-item.active .sidebar-icon{opacity:1}

/* ---- Landing ---- */
.landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:64px 32px;text-align:center;position:relative;overflow:hidden}
.landing::before{content:'';position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);pointer-events:none}
.landing-eyebrow{font-size:12px;font-weight:600;color:var(--accent-soft);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:16px}
.landing-title{font-size:52px;font-weight:700;letter-spacing:-1.5px;line-height:1.1;margin-bottom:16px;background:linear-gradient(180deg,#fff 40%,var(--text-tertiary) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.landing-subtitle{font-size:17px;color:var(--text-tertiary);max-width:440px;line-height:1.6;margin-bottom:56px}
.landing-form{display:flex;flex-direction:column;gap:20px;width:100%;max-width:560px;position:relative;z-index:1;align-items:center}
.landing-input-group{display:flex;gap:12px;width:100%}
.landing-input{flex:1;padding:14px 20px;background:var(--bg-surface);border:1px solid var(--border-primary);border-radius:12px;color:var(--text-primary);font-size:15px;font-family:inherit;outline:none;transition:all .2s ease}
.landing-input::placeholder{color:var(--text-quaternary)}
.landing-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.landing-browse-btn{padding:14px 20px;background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-primary);border-radius:12px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s ease;white-space:nowrap}
.landing-browse-btn:hover{background:var(--bg-hover);border-color:var(--border-secondary)}
.landing-btn{padding:14px 40px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s ease;white-space:nowrap;width:100%;max-width:240px}
.landing-btn:hover{background:var(--accent-soft);transform:translateY(-1px);box-shadow:0 4px 12px rgba(10,132,255,.3)}
.landing-btn:active{transform:translateY(0)}
.landing-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.landing-formats{margin-top:80px;display:flex;gap:40px;position:relative;z-index:1}
.landing-format-pill{padding:6px 16px;border-radius:20px;border:1px solid var(--border-primary);font-size:12px;color:var(--text-quaternary);letter-spacing:.3px}
.landing-error{margin-top:20px;color:var(--color-error);font-size:13px;max-width:520px;padding:12px 16px;background:var(--color-error-dim);border-radius:8px}

/* ---- Loading Wizard ---- */
.loading-view{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px;}
.wizard{width:100%;max-width:360px;display:flex;flex-direction:column;gap:24px;}
.wizard-stage{display:flex;align-items:center;gap:16px;opacity:0.4;transition:all 0.3s;}
.wizard-stage.active, .wizard-stage.done{opacity:1;}
.wizard-circle{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg-elevated);position:relative;flex-shrink:0;transition:all 0.3s;}
.wizard-circle .tick-svg{width:22px;height:22px;color:#fff;}
.wizard-circle .pct{font-size:11px;font-weight:700;color:var(--text-primary);z-index:2;}
.wizard-info{flex:1;}
.wizard-title{font-size:15px;font-weight:600;color:var(--text-primary);}
.wizard-desc{font-size:13px;color:var(--text-tertiary);margin-top:4px;}
.wizard-stage.active .wizard-circle{background:conic-gradient(var(--color-success) var(--progress, 0%), var(--bg-elevated) 0%);}
.wizard-stage.active .wizard-circle::after{content:'';position:absolute;inset:2px;background:var(--bg-surface);border-radius:50%;z-index:1;}
.wizard-stage.done .wizard-circle{background:var(--color-success);transform:scale(1.05);}
.tick-svg{stroke-dasharray:50;stroke-dashoffset:50;animation:drawTick 0.4s ease forwards;animation-delay:0.1s;}
@keyframes drawTick{to{stroke-dashoffset:0;}}

/* ---- Mode Toggle ---- */
.mode-toggle{display:flex;gap:6px;background:var(--bg-surface);padding:4px;border-radius:10px;border:1px solid var(--border-primary);margin-bottom:8px;width:100%;max-width:320px}
.mode-btn{flex:1;padding:8px 12px;border:none;background:none;color:var(--text-tertiary);font-size:12px;font-weight:500;cursor:pointer;border-radius:6px;transition:all .15s}
.mode-btn.active{background:var(--bg-elevated);color:var(--text-primary);box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* ---- Page header ---- */
.page-header{margin-bottom:40px;display:flex;justify-content:space-between;align-items:flex-start}
.page-title{font-size:28px;font-weight:600;letter-spacing:-.5px}
.page-subtitle{font-size:14px;color:var(--text-tertiary);margin-top:6px}

/* ---- Cards ---- */
.card{background:var(--bg-surface);border:1px solid var(--border-primary);border-radius:14px;padding:20px 24px;transition:border-color .15s}
.card:hover{border-color:var(--border-secondary)}
.card-title{font-size:11px;font-weight:500;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.card-value{font-size:26px;font-weight:600;letter-spacing:-.5px}
.card-detail{font-size:12px;color:var(--text-quaternary);margin-top:6px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;margin-bottom:36px}

/* Card color accents */
.card.accent-blue .card-value{color:var(--accent-soft)}
.card.accent-green .card-value{color:var(--color-success)}
.card.accent-purple .card-value{color:var(--purple)}
.card.accent-teal .card-value{color:var(--teal)}
.card.accent-warning .card-value{color:var(--color-warning)}
.card.accent-error .card-value{color:var(--color-error)}
.card.accent-orange .card-value{color:var(--orange)}
.card.accent-pink .card-value{color:var(--pink)}

/* ---- Health score ---- */
.health-score{display:flex;align-items:center;gap:36px;padding:28px 32px;background:var(--bg-surface);border:1px solid var(--border-primary);border-radius:16px;margin-bottom:36px}
.health-circle{position:relative;width:100px;height:100px;flex-shrink:0}
.health-circle svg{width:100%;height:100%;transform:rotate(-90deg)}
.health-circle-bg{fill:none;stroke:var(--border-primary);stroke-width:5}
.health-circle-fill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.health-number{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;letter-spacing:-.5px}
.health-meta{flex:1}
.health-grade{font-size:13px;color:var(--text-tertiary);margin-bottom:16px}
.health-grade strong{color:var(--text-primary)}
.health-breakdown{display:flex;flex-direction:column;gap:8px}
.hb-item{display:flex;align-items:center;gap:12px;font-size:13px}
.hb-label{width:100px;color:var(--text-tertiary)}
.hb-bar{flex:1;height:4px;background:var(--bg-elevated);border-radius:2px;overflow:hidden}
.hb-bar-fill{height:100%;border-radius:2px;transition:width .5s ease}
.hb-value{width:36px;text-align:right;color:var(--text-secondary);font-size:12px;font-variant-numeric:tabular-nums}

/* ---- Findings ---- */
.findings-list{display:flex;flex-direction:column;gap:6px;margin-bottom:36px}
.finding{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-radius:10px;font-size:13px;line-height:1.6}
.finding.error{background:var(--color-error-dim);border-left:3px solid var(--color-error)}
.finding.warning{background:var(--color-warning-dim);border-left:3px solid var(--color-warning)}
.finding.info{background:var(--color-info-dim);border-left:3px solid var(--color-info)}
.finding-icon{flex-shrink:0;width:18px;margin-top:1px;text-align:center;font-weight:700}
.finding.error .finding-icon{color:var(--color-error)}
.finding.warning .finding-icon{color:var(--color-warning)}
.finding.info .finding-icon{color:var(--color-info)}
.finding-title{font-weight:500;color:var(--text-primary)}
.finding-msg{color:var(--text-secondary);margin-top:2px}

/* ---- Tables ---- */
.table-wrap{overflow-x:auto;margin-bottom:36px;border:1px solid var(--border-primary);border-radius:12px;background:var(--bg-surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:12px 16px;font-weight:500;color:var(--text-tertiary);border-bottom:1px solid var(--border-primary);font-size:11px;text-transform:uppercase;letter-spacing:.5px;background:var(--bg-elevated)}
td{padding:10px 16px;border-bottom:1px solid var(--border-subtle);color:var(--text-secondary)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg-hover)}
.numeric{font-variant-numeric:tabular-nums;text-align:right}

/* ---- Section ---- */
.section{margin-bottom:48px}
.section-title{font-size:17px;font-weight:600;margin-bottom:16px;letter-spacing:-.3px}

/* ---- Badge ---- */
.badge{display:inline-flex;padding:4px 12px;border-radius:9999px;font-size:11px;font-weight:500;letter-spacing:.3px}
.badge.accent{background:var(--accent-dim);color:var(--accent-soft)}
.badge.success{background:var(--color-success-dim);color:var(--color-success)}
.badge.warning{background:var(--color-warning-dim);color:var(--color-warning)}
.badge.error{background:var(--color-error-dim);color:var(--color-error)}

/* ---- Detection list ---- */
.det-list{display:flex;flex-direction:column;gap:6px}
.det-item{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:10px;background:var(--bg-surface);border:1px solid var(--border-primary);transition:border-color .15s}
.det-item.selected{border-color:var(--accent);background:var(--accent-glow)}
.det-type{flex:1;font-size:13px;font-weight:500}
.det-conf{font-size:13px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}

/* ---- Export links ---- */
.export-links{display:flex;gap:8px}
.export-links a{text-decoration:none;cursor:pointer;transition:transform .1s}
.export-links a:hover{transform:translateY(-1px)}

/* ---- Chart containers ---- */
.chart-container{background:var(--bg-surface);border:1px solid var(--border-primary);border-radius:14px;padding:24px;margin-bottom:20px}
.chart-title{font-size:12px;font-weight:500;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:20px}
.chart-bar-group{display:flex;flex-direction:column;gap:5px}
.chart-bar-row{display:flex;align-items:center;gap:12px}
.chart-bar-label{width:90px;font-size:11px;color:var(--text-tertiary);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-bar-track{flex:1;height:22px;background:var(--bg-elevated);border-radius:5px;overflow:hidden}
.chart-bar-fill{height:100%;border-radius:5px;transition:width .4s ease;min-width:2px}
.chart-bar-val{width:55px;font-size:11px;color:var(--text-secondary);font-variant-numeric:tabular-nums}

/* ---- Image grid ---- */
.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:36px}
.image-item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg-elevated);border:1px solid var(--border-primary);transition:border-color .15s,transform .15s}
.image-item:hover{border-color:var(--border-secondary);transform:scale(1.02)}
.image-item img{width:100%;height:100%;object-fit:cover}
.image-label{position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:11px;font-weight:500}

/* ---- Tabs ---- */
.tabs{display:flex;gap:2px;margin-bottom:24px;background:var(--bg-surface);padding:3px;border-radius:10px;width:fit-content;flex-wrap:wrap;border:1px solid var(--border-primary)}
.tab{padding:7px 16px;border-radius:8px;font-size:12px;color:var(--text-tertiary);cursor:pointer;border:none;background:none;font-family:inherit;transition:all .12s;font-weight:500}
.tab:hover{color:var(--text-secondary)}
.tab.active{background:var(--accent-dim);color:var(--accent-soft)}

/* ---- Responsive ---- */
@media(max-width:768px){
  .sidebar{display:none}
  .app-content{margin-left:0;padding:24px 20px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .image-grid{grid-template-columns:repeat(2,1fr)}
  .landing-title{font-size:36px}
  .landing-form{flex-direction:column}
}
</style>
</head>
<body>
<div id="root"></div>

<script>
// ======================================================================
// Dataset Inspector — Standalone Frontend v2
// ======================================================================

const API = '/api';
let report = null;
let activePage = 'overview';
let analysisMode = 'sample';

// --- API ---
async function apiPost(url, body) {
  const res = await fetch(API + url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) { const e = await res.json().catch(() => ({ detail: res.statusText })); throw new Error(e.detail || 'Failed'); }
  return res.json();
}
async function apiGet(url) {
  const res = await fetch(API + url);
  if (!res.ok) { const e = await res.json().catch(() => ({ detail: res.statusText })); throw new Error(e.detail || 'Failed'); }
  return res.json();
}

// --- Utility ---
function fmt(n) { return n == null ? '—' : Number(n).toLocaleString(); }
function fmtBytes(b) {
  if (!b) return '0 B';
  const u = ['B','KB','MB','GB','TB'];
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return (b / Math.pow(1024, i)).toFixed(1) + ' ' + u[i];
}
function scoreColor(s) { return s >= 80 ? 'var(--color-success)' : s >= 60 ? 'var(--color-warning)' : 'var(--color-error)'; }
function h(tag, attrs) {
  const el = document.createElement(tag);
  const children = Array.from(arguments).slice(2);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') el.className = v;
    else if (k === 'innerHTML') el.innerHTML = v;
    else el.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(c => { if (c != null) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(report ? renderApp() : renderLanding());
}

// ===================== LANDING =====================
function renderLanding() {
  const input = h('input', { className: 'landing-input', type: 'text', id: 'path-input', placeholder: '/path/to/your/dataset', autofocus: '' });
  const browseBtn = h('button', { className: 'landing-browse-btn', type: 'button' }, 'Browse...');
  const analyzeBtn = h('button', { className: 'landing-btn', type: 'submit', id: 'analyze-btn', disabled: true }, 'Analyze');
  
  const sampleBtn = h('button', { type: 'button', className: 'mode-btn' + (analysisMode === 'sample' ? ' active' : '') }, 'Sample (Fast)');
  const fullBtn = h('button', { type: 'button', className: 'mode-btn' + (analysisMode === 'full' ? ' active' : '') }, 'Full (Exhaustive)');
  sampleBtn.onclick = () => { analysisMode = 'sample'; sampleBtn.classList.add('active'); fullBtn.classList.remove('active'); };
  fullBtn.onclick = () => { analysisMode = 'full'; fullBtn.classList.add('active'); sampleBtn.classList.remove('active'); };
  const modeToggle = h('div', { className: 'mode-toggle' }, sampleBtn, fullBtn);

  input.addEventListener('input', () => {
    analyzeBtn.disabled = !input.value.trim();
  });
  
  browseBtn.addEventListener('click', async () => {
    try {
      const res = await apiGet('/browse');
      if (res.path) {
        input.value = res.path;
        analyzeBtn.disabled = false;
      }
    } catch(e) { console.error('Browse failed:', e); }
  });

  const inputGroup = h('div', { className: 'landing-input-group' }, input, browseBtn);
  const form = h('form', { className: 'landing-form' }, inputGroup, modeToggle, analyzeBtn);
  
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const path = document.getElementById('path-input').value.trim();
    if (!path) return;
    wizardContainer = null;
    updateWizard({ status: 'pending', stage: 'Initializing...', message: 'Connecting to engine...' });
    try {
      const res = await apiPost('/analyze', { path, mode: analysisMode });
      if (res.job_id) {
        startProgressStream(res.job_id);
      } else {
        throw new Error('No job ID returned');
      }
    } catch (err) {
      render();
      document.querySelector('.landing').appendChild(
        h('div', { className: 'landing-error' }, err.message)
      );
    }
  });
  return h('div', { className: 'landing' },
    h('div', { className: 'landing-eyebrow' }, 'Local-first Analysis'),
    h('h1', { className: 'landing-title' }, 'Dataset Inspector'),
    h('p', { className: 'landing-subtitle' }, 'Understand any dataset in seconds. Enter a path to CSV, JSON, Parquet, Excel, or image folder.'),
    form,
    h('div', { className: 'landing-formats' },
      h('span', { className: 'landing-format-pill' }, 'CSV · TSV'),
      h('span', { className: 'landing-format-pill' }, 'JSON · Parquet'),
      h('span', { className: 'landing-format-pill' }, 'Excel'),
      h('span', { className: 'landing-format-pill' }, 'Image Folders'),
    )
  );
}

class ProgressQueue {
  constructor(jobId, es) {
    this.queue = [];
    this.isProcessing = false;
    this.lastStage = null;
    this.jobId = jobId;
    this.es = es;
  }
  
  push(data) {
    this.queue.push(data);
    this.process();
  }
  
  async process() {
    if (this.isProcessing) return;
    this.isProcessing = true;
    
    while (this.queue.length > 0) {
      const data = this.queue[0];
      
      if (data.status === 'complete') {
        if (this.lastStage) {
          updateWizard({ status: this.lastStage, stage_progress: 1.0, stage: 'Finishing up...', message: 'Done' });
          await new Promise(r => setTimeout(r, 500));
        }
        this.es.close();
        const res = await apiGet('/analyze/result/' + this.jobId);
        report = res.report;
        activePage = 'overview';
        render();
        this.queue.shift();
        continue;
      }
      
      if (data.status === 'error') {
        this.es.close();
        render();
        document.querySelector('.landing').appendChild(h('div', { className: 'landing-error' }, data.error || 'Analysis failed'));
        this.queue.shift();
        continue;
      }
      
      if (this.lastStage && this.lastStage !== data.status) {
        // Enforce min 500ms delay for stage transition (0.25s fill, 0.25s checkmark)
        updateWizard({ status: this.lastStage, stage_progress: 1.0, stage: 'Complete', message: 'Done' });
        await new Promise(r => setTimeout(r, 500));
      }
      
      this.lastStage = data.status;
      updateWizard(data);
      this.queue.shift();
      
      await new Promise(r => setTimeout(r, 20));
    }
    
    this.isProcessing = false;
  }
}

let currentQueue = null;

function startProgressStream(jobId) {
  const es = new EventSource(API + '/analyze/progress/' + jobId);
  currentQueue = new ProgressQueue(jobId, es);
  
  es.onmessage = async (e) => {
    const data = JSON.parse(e.data);
    currentQueue.push(data);
  };
  es.onerror = () => {
    es.close();
    render();
    document.querySelector('.landing').appendChild(h('div', { className: 'landing-error' }, 'Lost connection to server.'));
  };
}

let wizardContainer = null;
const WIZARD_STAGES = [
  { id: 'scanning', title: 'Scanning Filesystem' },
  { id: 'detecting', title: 'Detecting Format' },
  { id: 'loading', title: 'Loading Dataset' },
  { id: 'analyzing', title: 'Running Analyzers' }
];

function updateWizard(data) {
  if (!wizardContainer) {
    wizardContainer = h('div', { className: 'wizard' });
    const root = document.getElementById('root');
    root.innerHTML = '';
    root.appendChild(h('div', { className: 'loading-view' }, wizardContainer));
  }
  
  wizardContainer.innerHTML = '';
  let currentFound = false;
  
  WIZARD_STAGES.forEach(stageDef => {
    let state = 'pending';
    let pct = 0;
    
    if (data.status === stageDef.id) {
      state = 'active';
      pct = Math.round((data.stage_progress || 0) * 100);
      currentFound = true;
    } else if (!currentFound) {
      state = 'done';
      pct = 100;
    }
    
    const checkSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="tick-svg"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    const circleInner = state === 'done' ? checkSvg : `<span class="pct">${pct}%</span>`;
    
    const circleStyle = state === 'active' ? { '--progress': pct + '%' } : {};
    const circle = h('div', { className: 'wizard-circle', innerHTML: circleInner, style: circleStyle });
    
    const info = h('div', { className: 'wizard-info' },
      h('div', { className: 'wizard-title' }, state === 'active' ? (data.stage || stageDef.title) : stageDef.title),
      h('div', { className: 'wizard-desc' }, state === 'active' ? data.message : (state === 'done' ? 'Complete' : 'Pending...'))
    );
    
    wizardContainer.appendChild(h('div', { className: 'wizard-stage ' + state }, circle, info));
  });
}

// ---- Helpers ----
function statCard(title, value, detail, accent) {
  return h('div', { className: 'card' + (accent ? ' accent-' + accent : '') },
    h('div', { className: 'card-title' }, title),
    h('div', { className: 'card-value' }, String(value != null ? value : '—')),
    detail ? h('div', { className: 'card-detail' }, detail) : null
  );
}

function renderBarChart(title, data, color, altColors) {
  color = color || 'var(--accent)';
  if (!data || !data.length) return h('div');
  const max = Math.max(...data.map(d => d.value || d.count || 0));
  const container = h('div', { className: 'chart-container' }, h('div', { className: 'chart-title' }, title));
  const group = h('div', { className: 'chart-bar-group' });
  const colors = altColors || [color];
  data.slice(0, 15).forEach((d, i) => {
    const val = d.value || d.count || 0;
    const pct = max > 0 ? (val / max * 100) : 0;
    const c = colors[i % colors.length];
    group.appendChild(h('div', { className: 'chart-bar-row' },
      h('div', { className: 'chart-bar-label', title: d.name || d.bin || '' }, d.name || d.bin || ''),
      h('div', { className: 'chart-bar-track' }, h('div', { className: 'chart-bar-fill', style: { width: pct + '%', background: c } })),
      h('div', { className: 'chart-bar-val' }, fmt(val))
    ));
  });
  container.appendChild(group);
  return container;
}

function renderFindings(findings, limit) {
  if (!findings || !findings.length) return h('div', { style: { color: 'var(--text-tertiary)', fontSize: '13px' } }, 'No issues found.');
  const sorted = [...findings].sort((a, b) => ({ error: 0, warning: 1, info: 2 }[a.severity] || 3) - ({ error: 0, warning: 1, info: 2 }[b.severity] || 3));
  const shown = limit ? sorted.slice(0, limit) : sorted;
  const icons = { error: '✕', warning: '⚠', info: 'ℹ' };
  const list = h('div', { className: 'findings-list' });
  shown.forEach(f => {
    list.appendChild(h('div', { className: 'finding ' + f.severity },
      h('span', { className: 'finding-icon' }, icons[f.severity] || '·'),
      h('div', {}, h('div', { className: 'finding-title' }, f.title), h('div', { className: 'finding-msg' }, f.message))
    ));
  });
  if (limit && sorted.length > limit) list.appendChild(h('div', { style: { fontSize: '12px', color: 'var(--text-quaternary)', paddingTop: '8px' } }, '+ ' + (sorted.length - limit) + ' more'));
  return list;
}

// ---- Examples ----
function renderExamples() {
  const examples = report.examples || [];
  const page = h('div', {}, h('div', { className: 'page-header' }, h('div', {}, h('h1', { className: 'page-title' }, 'Examples'), h('p', { className: 'page-subtitle' }, examples.length + ' samples'))));
  const isImage = examples.some(e => e.type === 'image');
  const isTabular = examples.some(e => e.type === 'tabular');

  if (isImage) {
    const grid = h('div', { className: 'image-grid' });
    examples.filter(e => e.type === 'image').forEach(ex => {
      const item = h('div', { className: 'image-item' });
      const img = h('img', { loading: 'lazy', alt: ex.filename || '' });
      fetch('/api/image/thumbnail?path=' + encodeURIComponent(ex.path) + '&size=256')
        .then(r => r.json()).then(d => { img.src = d.data; }).catch(() => {});
      item.appendChild(img);
      if (ex.label) item.appendChild(h('div', { className: 'image-label' }, ex.label));
      grid.appendChild(item);
    });
    page.appendChild(grid);
  }

  if (isTabular && examples.length) {
    const cols = Object.keys(examples[0].data || {});
    const wrap = h('div', { className: 'table-wrap' });
    const tbl = h('table');
    tbl.appendChild(h('thead', {}, h('tr', {}, ...cols.map(c => h('th', {}, c)))));
    const tbody = h('tbody');
    examples.filter(e => e.type === 'tabular').slice(0, 50).forEach(ex => {
      tbody.appendChild(h('tr', {}, ...cols.map(c => h('td', {}, ex.data[c] != null ? String(ex.data[c]) : '—'))));
    });
    tbl.appendChild(tbody); wrap.appendChild(tbl); page.appendChild(wrap);
  }

  if (!examples.length) page.appendChild(h('div', { style: { color: 'var(--text-tertiary)', fontSize: '13px' } }, 'No examples available.'));
  return page;
}

// ---- Init ----
render();
</script>
</body>
</html>
